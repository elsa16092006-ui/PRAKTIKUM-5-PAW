$kind: http-request
name: Login Costumer
description: ""
url: http://127.0.0.1:8000/api/v1/auth/login
method: POST
headers:
  - key: Accept
    value: application/json
    disabled: true
body:
  type: json
  content: "{\r

    \ \"email\": \"elsa123@gmail.com\",\r

    \ \"password\": \"????????\",\r

    \ \"device_name\": \"Postman Praktikum\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      pm.collectionVariables.set('customer_token', json.access_token);"
    language: text/javascript
order: 4000
